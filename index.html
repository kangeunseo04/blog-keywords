<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>깡 키워드 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Batang:wght@700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F7F3;--surface:#FFFFFF;--ink:#17231D;--muted:#66756C;--line:#D9E1DA;
  --accent:#1E7A4B;--accent-soft:#E3F2E8;--warn:#B8791B;--warn-soft:#F7ECD7;--bad:#B9432C;--bad-soft:#F8E3DE;--good:#1E7A4B;--good-soft:#E3F2E8;
  --neutral-soft:#EEF1EC;--shadow:0 1px 2px rgba(23,35,29,.06),0 6px 18px rgba(23,35,29,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10160F;--surface:#182018;--ink:#E8EFE8;--muted:#91A094;--line:#2A352C;
  --accent:#5BC98C;--accent-soft:#1D3326;--warn:#E0A84A;--warn-soft:#3A2E17;--bad:#E36A54;--bad-soft:#3D2019;--good:#5BC98C;--good-soft:#1D3326;
  --neutral-soft:#212B22;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10160F;--surface:#182018;--ink:#E8EFE8;--muted:#91A094;--line:#2A352C;
  --accent:#5BC98C;--accent-soft:#1D3326;--warn:#E0A84A;--warn-soft:#3A2E17;--bad:#E36A54;--bad-soft:#3D2019;--good:#5BC98C;--good-soft:#1D3326;
  --neutral-soft:#212B22;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;padding-block:0 48px;padding-inline:16px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:22px 12px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:"Gowun Batang","Noto Serif KR",serif;font-weight:700;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
h1 small{font-family:"IBM Plex Sans KR",sans-serif;font-size:15px;font-weight:500;color:var(--muted);margin-left:8px}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--neutral-soft);color:var(--muted);font-weight:500}
section{margin-top:28px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
h2 span.n{font-weight:400;letter-spacing:0;text-transform:none;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card .kw{font-family:"Gowun Batang",serif;font-size:24px;font-weight:700;line-height:1.2}
.card .cat{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.ok{background:var(--neutral-soft);color:var(--ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel span{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
.rel span b{font-weight:500;color:var(--muted);margin-left:4px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .rank{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:13px}
.row .name{font-weight:600;font-size:15px}
.row .name small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.row .facts{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:center}
.row .facts b{color:var(--ink);font-weight:600}
.row .score{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.bar{width:56px;height:6px;border-radius:3px;background:var(--neutral-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.up{color:var(--good)}.down{color:var(--bad)}
svg.spark{width:100%;height:44px;display:block}
.row svg.spark{width:84px;height:28px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.buzz{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bz .t{font-weight:600;font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bz .t em{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.fresh{height:6px;border-radius:3px;background:var(--neutral-soft);overflow:hidden}
.fresh i{display:block;height:100%;background:var(--warn);border-radius:3px}
.bz .f{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.bz .f b{color:var(--ink);font-weight:600}
.bz a{font-size:12px;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bz a:hover{text-decoration:underline}
.note{font-size:12px;color:var(--muted);line-height:1.6}
details{margin-top:18px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;font-weight:600;color:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.empty b{color:var(--ink)}
.state{text-align:center;color:var(--muted);padding:40px 0}
.nodata{font-size:12px;color:var(--muted)}
@media (max-width:480px){h1{font-size:28px}.stats{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:24px 1fr auto}}
@media (prefers-reduced-motion:no-preference){.bar i,.fresh i{transition:width .5s ease}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="topbar">
    <div>
      <div class="eyebrow">깡유니버스의 깡 · 내일 키워드</div>
      <h1 id="h1">불러오는 중</h1>
    </div>
    <label class="nodata">날짜 <select id="dates"><option>—</option></select></label>
  </div>
  <div class="chips" id="tags"></div>
  <div class="meta" id="meta"></div>
</header>
<main id="main"><div class="state">리포트를 불러오는 중…</div></main>
</div>
<script>
(function(){
  const $=(s,el=document)=>el.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>(n==null||n==='')?'-':Number(n).toLocaleString('ko-KR');
  const WD=['일','월','화','수','목','금','토'];
  const arrow=x=>x>=1.5?`<span class="up">↑↑ ${x.toFixed(1)}배</span>`:x>=1.15?`<span class="up">↑ ${x.toFixed(1)}배</span>`:x<=0.7?`<span class="down">↓ ${x.toFixed(1)}배</span>`:'→ 보합';
  const pctw=x=>{const d=Math.round((x-1)*100);return Math.abs(d)<3?'보통':(d>0?`<span class="up">+${d}%</span>`:`<span class="down">${d}%</span>`)};
  const gradeCls=g=>g==='매우 높음'||g==='높음'?'good':g==='보통'?'ok':g==='낮음'?'warn':g?'bad':'ok';
  const satPill=r=>r.saturation==null?'<span class="pill ok">포화도 -</span>':`<span class="pill ${gradeCls(r.grade)}">포화도 ${Math.round(r.saturation*100)}% · ${esc(r.grade)}</span>`;
  const volTxt=(r,hasVol)=>hasVol&&r.monthly_search!=null?`${fmt(r.monthly_search)}회/월`:`×${Number(r.rel_volume).toFixed(2)}`;
  const views=n=>!n?'-':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.floor(n/1e3)+'K':String(n);

  function spark(series,cls){
    if(!series||series.length<2)return '';
    const vals=series.map(p=>p[1]);const max=Math.max(...vals,1e-9),min=Math.min(...vals);
    const W=200,H=44,pad=3;const n=vals.length;
    const x=i=>pad+i*(W-2*pad)/(n-1);const y=v=>H-pad-((v-min)/((max-min)||1))*(H-2*pad);
    let d='';vals.forEach((v,i)=>{d+=(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '});
    const area=d+`L${x(n-1).toFixed(1)} ${H-pad} L${x(0).toFixed(1)} ${H-pad} Z`;
    const lx=x(n-1).toFixed(1),ly=y(vals[n-1]).toFixed(1);
    return `<svg class="spark ${cls||''}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${lx}" cy="${ly}" r="2.4" fill="var(--accent)"/></svg>`;
  }

  function rowHtml(r,i,hasVol){
    return `<div class="row">
      <div class="rank">${i}</div>
      <div class="name">${esc(r.keyword)}${r.is_context?' 🗓':''}<small>${esc(r.category)}</small></div>
      <div class="score"><span class="bar"><i style="width:${Math.max(4,Math.min(100,r.score))}%"></i></span>${r.score}</div>
      <div class="facts">
        <span>${hasVol?'월 검색':'검색량'} <b>${volTxt(r,hasVol)}</b></span>
        <span>최근 ${arrow(r.momentum)}</span>
        <span>작년 ${arrow(r.seasonal)}</span>
        <span>요일 ${pctw(r.weekday)}</span>
        <span>월 발행 <b>${fmt(r.monthly_posts)}</b></span>
        <span>7일 새 글 <b>${fmt(r.recent7)}</b></span>
        ${satPill(r)}
      </div>
    </div>`;
  }

  function cardHtml(r,hasVol){
    const rel=(r.related||[]).slice(0,8).map(x=>`<span>${esc(x.keyword)}<b>${fmt(x.total)}</b></span>`).join('');
    return `<div class="card">
      <div><div class="kw">${esc(r.keyword)}</div><div class="cat">${esc(r.category)} · 점수 ${r.score}</div></div>
      ${spark(r.series)}
      <div class="stats">
        <div class="stat"><span class="l">${hasVol?'월 검색량':'검색량(상대)'}</span><span class="v">${volTxt(r,hasVol)}</span></div>
        <div class="stat"><span class="l">월 발행량</span><span class="v">${fmt(r.monthly_posts)}</span></div>
        <div class="stat"><span class="l">노출 기회</span><span class="v">${r.grade?esc(r.grade):'-'}</span></div>
        <div class="stat"><span class="l">최근흐름</span><span class="v">${arrow(r.momentum)}</span></div>
        <div class="stat"><span class="l">작년 같은 때</span><span class="v">${arrow(r.seasonal)}</span></div>
        <div class="stat"><span class="l">요일 성향</span><span class="v">${pctw(r.weekday)}</span></div>
      </div>
      ${rel?`<div><div class="nodata" style="margin-bottom:6px">연관 키워드 (월 검색량)</div><div class="rel">${rel}</div></div>`:''}
    </div>`;
  }

  function buzzHtml(b){
    const src=(b.src||[]).includes('news')?'<em>📰 뉴스</em>':'';const yt=(b.src||[]).includes('youtube')?'<em>▶️ 유튜브</em>':'';
    const link=b.example_link?`<a href="${esc(b.example_link)}" target="_blank" rel="noopener">${esc(b.example_title||b.example_link)}</a>`:(b.example_title?`<span class="nodata">${esc(b.example_title)}</span>`:'');
    const mom=b.mom===0?'검색 거의 없음':arrow(b.mom);
    return `<div class="bz">
      <div class="t">${esc(b.phrase)} ${src}${yt}</div>
      <div class="fresh" title="새 글 비율"><i style="width:${Math.round(b.share*100)}%"></i></div>
      <div class="f"><span>새 글 비율 <b>${Math.round(b.share*100)}%</b></span><span>7일 <b>${fmt(b.c7)}</b>/${fmt(b.total)}</span><span>유튜브 <b>${views(b.yt_views)}</b></span><span>검색 <b>${mom}</b></span></div>
      ${link}
    </div>`;
  }

  function render(d){
    const t=new Date(d.target+'T00:00:00');
    $('#h1').innerHTML=`${t.getMonth()+1}월 ${t.getDate()}일 ${WD[t.getDay()]}요일<small>기준</small>`;
    document.title=`깡 키워드 보드`;
    $('#tags').innerHTML=(d.tags||[]).map(x=>`<span class="chip" title="${esc(x.why)}">${esc(x.tag)}</span>`).join('')+(d.after_holiday?'<span class="chip warn">연휴 직후 보정</span>':'')+`<span class="chip plain">작년 비교: ${esc(d.ly_note)}</span>`;
    const hasVol=!!(d.meta&&d.meta.has_monthly_search);
    $('#meta').innerHTML=`<span>${esc(d.generated_at)} 실행</span><span>키워드 ${d.meta?d.meta.keyword_count:'-'}개</span><span>${hasVol?'월 검색량: 네이버 검색광고':'검색량: 데이터랩 상대값 (검색광고 키를 넣으면 실제 월 검색량)'}</span>`;
    const cats=Object.keys(d.by_category||{});
    let html='';
    if(d.picks&&d.picks.length){html+=`<section><h2>오늘 2편 제안</h2><div class="cards">${d.picks.map(r=>cardHtml(r,hasVol)).join('')}</div></section>`}
    html+=`<section><h2>내일 쓸 만한 키워드 TOP 10 <span class="n">점수순</span></h2><div class="list">${(d.top10||[]).map((r,i)=>rowHtml(r,i+1,hasVol)).join('')}</div></section>`;
    if(d.buzz&&d.buzz.length){html+=`<section><h2>요즘 뜨는 것 <span class="n">블로그·뉴스·유튜브 제목에서 새로 많이 보이는 이름</span></h2><div class="buzz">${d.buzz.map(buzzHtml).join('')}</div><p class="note" style="margin-top:8px">막대 = 이 이름으로 된 블로그 글 중 이번 주에 쓰인 비율. 꽉 찰수록 완전히 새로 나온 것. 글이 적을 때 선점하는 용도라, 한 번 검색해 확인하고 쓰세요.</p></section>`}
    if(cats.length){
      html+=`<section><h2>카테고리별 TOP 5</h2><div class="tabs" role="tablist">${cats.map((c,i)=>`<button role="tab" aria-selected="${i===0}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="catlist" class="list"></div></section>`;
    }
    if(d.no_data&&d.no_data.length){html+=`<details><summary>검색량이 거의 없어 제외한 키워드 ${d.no_data.length}개</summary><p>${d.no_data.map(esc).join(', ')}</p></details>`}
    html+=`<details><summary>점수는 어떻게 매기나</summary><p class="note">검색량(35) + 최근흐름(대상일과 같은 종류의 날 최근 3일 ÷ 이전 4주) + 작년 같은 시점(추석·설은 명절 기준으로 맞춤, 올해 흐름이 받쳐줄 때만) + 요일 성향(최근 8주 그 요일 평균 ÷ 전체, 15) + 경쟁도(전체 글·최근 7일 글·포화도, 15) + 달력 키워드 가산(10). 검색량이 <code>${esc(d.meta&&d.meta.anchor||'다이어트')}</code>의 10% 미만이면 상승 점수 축소, 작년 같은 시점에 꺼진 키워드는 절반. 포화도 = 월 발행량 ÷ 월 검색량, 낮을수록 노출 기회가 큽니다.</p></details>`;
    $('#main').innerHTML=html;
    if(cats.length){
      const show=c=>{$('#catlist').innerHTML=(d.by_category[c]||[]).map((r,i)=>rowHtml(r,i+1,hasVol)).join('')||'<div class="row"><div class="rank"></div><div class="name nodata">후보 없음</div></div>'};
      show(cats[0]);
      document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));show(b.dataset.cat)}));
    }
  }

  async function getJSON(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}

  async function loadDates(){
    try{
      const idx=await getJSON('reports/index.json');
      const sel=$('#dates');sel.innerHTML=idx.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
      sel.addEventListener('change',()=>load('reports/'+sel.value+'.json'));
      return idx;
    }catch(e){return null}
  }

  async function load(url){
    try{const d=await getJSON(url);render(d);}
    catch(e){
      $('#h1').textContent='아직 리포트가 없어요';
      $('#main').innerHTML=`<div class="empty"><b>reports/latest.json</b>을 찾지 못했어요.<br>GitHub Actions에서 <b>내일 키워드 뽑기</b>를 한 번 실행하면 생겨요.<br>실행했는데도 이 화면이면 Settings → Pages가 <b>main / (root)</b>로 켜져 있는지 확인해 주세요.</div>`;
    }
  }

  (async()=>{
    const idx=await loadDates();
    await load('reports/latest.json');
    if(idx&&idx.length){$('#dates').value=idx[0]}
  })();
})();
</script>
</body>
</html>
